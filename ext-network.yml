# Make the external Traefik network the only network for every service (the same
# pattern the other *-docker repos use). Prometheus docker service discovery only
# keeps the first network of a container (match_first_network); with a second,
# internal network the scrape address was an IP Prometheus cannot reach.
networks:
  default:
    name: ${DOCKER_EXT_NETWORK:-traefik_default}
    external: true
